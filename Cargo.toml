[package]
name = "agente"
description = "A AI assistant that lives in your terminal."
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = [ "crates/app","crates/domain"]

[dependencies]
agente-app = { path = "crates/app" }
agente-domain = { path = "crates/domain" }
tokio = { version = "1.48.0", features = ["full"] }
