[package]
name = "agente"
description = "A AI assistant that lives in your terminal."
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["crates/application", "crates/domain", "crates/infrastructure"]

[workspace.dependencies]
async-trait = "0.1.89"
serde = "1.0.228"
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "macros", "uuid", "chrono"] }
tokio = { version = "1.48.0", features = ["full"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }

[dependencies]
agente-application = { path = "crates/application" }
agente-domain = { path = "crates/domain" }
agente-infrastructure = { path = "crates/infrastructure" }
async-recursion = "1.1.1"
async-trait = { workspace = true }
regex = "1.12.3"
tokio = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
